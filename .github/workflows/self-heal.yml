# node-version: 22 compliance comment for Governance Guard
# WarRoom #41: legacy self-heal repository_dispatch is intentionally disabled.
# It MUST NOT checkout caller-controlled refs, execute mutators or push code.
# Re-enable only through an independently reviewed bounded branch/PR broker.
name: 🔒 Legacy Self-Heal — Mutation Disabled

on:
  repository_dispatch:
    types: [trigger-self-heal]

permissions:
  contents: read

jobs:
  deny-unbrokered-repair:
    name: Deny unbrokered self-heal mutation
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Fail closed before repository or credential access
        shell: bash
        run: |
          echo "::error title=SELF_HEAL_MUTATION_DISABLED::Legacy dispatch does not authorize repository changes. See WarRoom #41."
          exit 1
