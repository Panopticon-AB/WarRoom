# WarRoom #41: default-branch pushes and workflow_dispatch are NOT
# authorization to deploy. Re-enable only with a canonical exact-revision,
# operator-approved deployment receipt and a separately scoped live executor.
name: 🔒 Legacy Coolify Deploy — Mutation Disabled

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny-unapproved-deploy:
    name: Deny unbrokered production deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Fail closed before credential or network access
        shell: bash
        run: |
          echo "::error title=PRODUCTION_DEPLOY_APPROVAL_REQUIRED::No direct deployment from GitHub push or manual trigger. See WarRoom #41."
          exit 1
