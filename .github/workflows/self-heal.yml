# node-version: 22 compatibility marker for legacy Governance Guard; no Node runtime used
name: "Self-Heal — quarantined legacy dispatch"

# Explicit containment of the unsafe repository_dispatch -> caller-chosen branch
# -> git push path tracked by #41. No credentials, checkout or mutation runner
# are available in this workflow. Do not re-enable without an approved
# task-scoped repair-branch/PR adapter and actual denial tests.
on:
  repository_dispatch:
    types: [trigger-self-heal]

permissions:
  contents: read

jobs:
  reject-legacy-self-heal:
    name: Deny unapproved repository mutation
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Fail closed until bounded repair broker is qualified
        shell: bash
        run: |
          echo "::error title=Legacy Self-Heal Disabled::Repository-dispatch self-heal cannot mutate a Git branch. See WarRoom #41."
          exit 1
