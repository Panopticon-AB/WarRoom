name: "Coolify deploy — approval gate unavailable"

# Containment for WarRoom #41: neither a push to master/main/develop nor
# a manual workflow_dispatch is production-deployment authorization.
# Until an exact app/revision/environment operator approval broker and
# separate live-approved execution identity have been commissioned,
# this legacy path must deny BEFORE obtaining credentials or network access.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  block-unapproved-deploy:
    name: Deny deployment until canonical approval integration
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Fail closed without scoped deployment approval
        shell: bash
        run: |
          echo "::error title=Legacy Deployment Disabled::Workflow dispatch is not a production approval. See WarRoom #41."
          exit 1
