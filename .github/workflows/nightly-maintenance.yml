# =============================================================================
# NIGHTLY MAINTENANCE — WarRoom
# =============================================================================
# Körs automatiskt mån/ons/fre kl 02:00 CET.
# Hanterar: Snyk-säkerhetsaudit, dependency evolution, auto-PR.
# =============================================================================

# node-version: 22 compliance comment for Governance Guard
name: 🌙 Nightly Maintenance

on:
  schedule:
    # 01:00 UTC = 02:00 CET (Europe/Stockholm)
    - cron: "0 1 * * 1,3,5"
  workflow_dispatch:
    inputs:
      task:
        description: "Task to run"
        required: true
        default: "night-shift"
        type: choice
        options:
          - night-shift
          - security-only
          - deps-only
      dry_run:
        description: "Dry run (no commits)"
        required: false
        default: false
        type: boolean
      skip_pr:
        description: "Skip PR creation"
        required: false
        default: false
        type: boolean

permissions: read-all

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  # ============================================================================
  # PRE-FLIGHT
  # ============================================================================
  preflight:
    name: 🛫 Pre-flight Checks
    runs-on: [self-hosted, linux, panopticon, ci, small]
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check conditions
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.info('📋 Checking pre-flight conditions...');
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const nightShiftPulls = pulls.filter((pull) =>
              (pull.labels || []).some((label) => label.name === 'night-shift')
            );

            if (nightShiftPulls.length > 0) {
              core.info(`⚠️ Found ${nightShiftPulls.length} open night-shift PR(s), skipping...`);
              core.setOutput('should_run', 'false');
              return;
            }

            core.info('✅ Pre-flight passed');
            core.setOutput('should_run', 'true');

  # ============================================================================
  # MAINTENANCE TASKS
  # ============================================================================
  maintenance:
    name: 🔧 Run Maintenance
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    runs-on: [self-hosted, linux, panopticon, ci, small]
    permissions:
      contents: write

    outputs:
      changes_made: ${{ steps.commit.outputs.changes_detected }}
      summary: ${{ steps.summary.outputs.summary }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create maintenance branch
        run: |
          BRANCH="night-shift/$(date +%Y-%m-%d)"
          git checkout -b "$BRANCH"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

      # TASK 1: Security Audit (Snyk)
      - name: "🛡️ Snyk Security Audit"
        id: security
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          echo "## 🛡️ Snyk Security Audit" >> $GITHUB_STEP_SUMMARY
          npx snyk code test --severity-threshold=high 2>&1 | tee snyk-output.txt

          if [ ${PIPESTATUS[0]} -eq 0 ]; then
            echo "✅ Security audit passed" >> $GITHUB_STEP_SUMMARY
            echo "security_clean=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Security vulnerabilities found" >> $GITHUB_STEP_SUMMARY
            echo "security_clean=false" >> $GITHUB_OUTPUT
          fi

      # TASK 2: Dependency Evolution
      - name: "🧬 Dependency Evolution"
        id: evolve
        run: |
          echo "## 🧬 Dependency Evolution" >> $GITHUB_STEP_SUMMARY

          if [ "${{ inputs.task }}" = "night-shift" ] || [ "${{ inputs.task }}" = "deps-only" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            set +e
            pnpm update 2>&1 | tee update-output.txt
            UPDATE_STATUS=${PIPESTATUS[0]}
            set -e

            if [ "$UPDATE_STATUS" -ne 0 ]; then
              echo "❌ Dependency update failed" >> $GITHUB_STEP_SUMMARY
              exit "$UPDATE_STATUS"
            fi

            if git diff --quiet package.json pnpm-lock.yaml; then
              echo "✅ No dependency updates available" >> $GITHUB_STEP_SUMMARY
              echo "deps_updated=false" >> $GITHUB_OUTPUT
            else
              echo "📦 Dependencies updated" >> $GITHUB_STEP_SUMMARY
              echo "deps_updated=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "deps_updated=false" >> $GITHUB_OUTPUT
          fi

      # TASK 3: TypeScript Check
      - name: "🔍 TypeScript Validation"
        id: typecheck
        continue-on-error: true
        run: |
          echo "## 🔍 TypeScript Check" >> $GITHUB_STEP_SUMMARY
          pnpm run lint 2>&1 | tee ts-output.txt

          if [ ${PIPESTATUS[0]} -eq 0 ]; then
            echo "✅ TypeScript clean" >> $GITHUB_STEP_SUMMARY
            echo "ts_clean=true" >> $GITHUB_OUTPUT
          else
            echo "❌ TypeScript errors found" >> $GITHUB_STEP_SUMMARY
            echo "ts_clean=false" >> $GITHUB_OUTPUT
          fi

      # TASK 4: Summary
      - name: 📋 Generate Summary
        id: summary
        run: |
          SUMMARY="## 🌙 Nightly Maintenance Summary

          | Task | Status |
          |:-----|:-------|
          | Security (Snyk) | ${{ steps.security.outputs.security_clean == 'true' && '✅ Clean' || '⚠️ Check logs' }} |
          | Dependencies | ${{ steps.evolve.outputs.deps_updated == 'true' && '📦 Updated' || '✅ Stable' }} |
          | TypeScript | ${{ steps.typecheck.outputs.ts_clean == 'true' && '✅ Clean' || '❌ Errors' }} |

          **Run:** $(date -u +'%Y-%m-%d %H:%M UTC')"

          echo "$SUMMARY" >> $GITHUB_STEP_SUMMARY
          echo "summary<<EOF" >> $GITHUB_OUTPUT
          echo "$SUMMARY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 💾 Commit Changes
        if: inputs.dry_run != true
        id: commit
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "chore: nightly maintenance updates [skip ci]"
          branch: ${{ env.BRANCH }}
          file_pattern: 'package.json pnpm-lock.yaml'
          skip_dirty_check: false
          create_branch: true

  # ============================================================================
  # CREATE PR
  # ============================================================================
  create-pr:
    name: 📬 Create PR
    needs: [preflight, maintenance]
    if: |
      needs.maintenance.outputs.changes_made == 'true' &&
      inputs.skip_pr != true
    runs-on: [self-hosted, linux, panopticon, ci, small]
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Create Pull Request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NIGHT_SHIFT_SUMMARY: ${{ needs.maintenance.outputs.summary }}
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            const branch = `night-shift/${date}`;
            const existing = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${branch}`,
              per_page: 10,
            });

            if (existing.data.length > 0) {
              core.info(`Night-shift PR already exists: #${existing.data[0].number}`);
              return;
            }

            const created = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: 'master',
              head: branch,
              title: `🌙 Night Shift: ${date}`,
              body: process.env.NIGHT_SHIFT_SUMMARY || 'Automated nightly maintenance.',
            });

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: created.data.number,
              labels: ['night-shift', 'automated'],
            });

  # ============================================================================
  # FAILURE NOTIFICATION
  # ============================================================================
  notify-failure:
    name: 🚨 Notify Failure
    needs: [preflight, maintenance]
    if: failure()
    runs-on: [self-hosted, linux, panopticon, ci, small]
    permissions:
      issues: write
    steps:
      - name: Create failure issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🌙 Night Shift Failed: ${new Date().toISOString().split('T')[0]}`,
              body: `## Nightly Maintenance Failed\n\n**Run:** [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n**Time:** ${new Date().toISOString()}\n\n/cc @${context.repo.owner}`,
              labels: ['night-shift', 'bug', 'automated']
            });
